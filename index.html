    <script>
        // The service worker only caches the application shell. Registering it is what makes the
        // application installable. A refused registration - private browsing, a policy, or an
        // embedded browser - is not an application failure, so it is swallowed instead of surfacing
        // as an unhandled rejection.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(() => { });
        }
    </script>
